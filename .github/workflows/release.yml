name: Release

# Draft a GitHub Release (v* tag) → this builds the Windows artifacts and
# attaches them to that release. workflow_dispatch = build without a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Builds web dist + server bundle, stages the app (bundled node.exe,
      # better-sqlite3 prebuild matching the runner's Node ABI), and runs
      # electron-builder → release/PraiseSuite-Setup-*.exe + *-portable.exe.
      - name: Package desktop app
        working-directory: apps/desktop
        run: node scripts/stage.mjs --pack

      # On release events this attaches the EXEs to that release; on manual
      # runs it creates a draft release so the artifacts still land somewhere.
      - name: Publish artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/PraiseSuite-Setup-*.exe
            apps/desktop/release/*-portable.exe
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
